<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: url('roses-bg.jpg') center/cover no-repeat fixed;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* Qorong'i overlay — matn o'qilishi uchun */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, 
        rgba(40, 10, 20, 0.55) 0%, 
        rgba(60, 15, 30, 0.65) 50%, 
        rgba(30, 8, 15, 0.75) 100%);
      z-index: 0;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 50px 20px 70px;
      position: relative;
      z-index: 2;
    }

    /* Logo / Brand */
    .brand-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 2px 15px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #ffd6e0;
      font-weight: 400;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    /* Description card */
    .desc-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 28px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .desc-card p {
      font-size: 14.5px;
      line-height: 1.65;
      color: #ffe8ee;
      margin-bottom: 8px;
    }

    .desc-card p:last-child {
      margin-bottom: 0;
    }

    /* Section title */
    .section-title {
      text-align: center;
      font-size: 15px;
      color: #ffc8d4;
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: #fff;
      transition: all 0.28s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e85a7a, #c23a5a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(200, 50, 80, 0.4);
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .link-text {
      display: flex;
      flex-direction: column;
    }

    .link-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
    }

    .link-sub {
      font-size: 13px;
      color: #ffd0dc;
      margin-top: 2px;
    }

    /* Delivery badge */
    .delivery {
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 14.5px;
      color: #ffe0e8;
      border: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: rgba(255, 220, 230, 0.7);
    }

    @media (max-width: 420px) {
      .container {
        padding: 30px 16px 50px;
      }
      .brand {
        font-size: 26px;
      }
      .link-card {
        padding: 14px 16px;
      }
      .link-icon {
        width: 38px;
        height: 38px;
      }
      .link-icon svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
